# Settings for the PHI check (tools/phi_guard.pl), used by the pre-commit hook
# and the GitHub check. This file is per repository (the check itself is lab
# core); changes need the PI's approval.

# Smallest count allowed in summary tables (results/tables/*.csv or .tsv).
# 0 turns the check off. Set it if your data use agreement requires small-cell
# suppression (for example 11).
MIN_CELL=0

# Columns in those tables that hold counts (case-insensitive, comma-separated).
COUNT_COLUMNS=n,count

# Files larger than this (in MB) are refused; they usually hold data.
LARGE_FILE_MB=10

# Most table-like rows (delimited or printed) or records (JSON, YAML, HTML
# table rows, values in one dput()-style list) allowed in any non-code file.
# More look like row-level data, for example de-identified cohort data, which
# has no identifiers. 0 turns these checks off.
MAX_TABLE_ROWS=200

# Column names that mean one row per person (case-insensitive, comma-separated).
# Any table-like file whose first line has one of these columns is refused.
ID_COLUMNS=id,idno,id_c,short_id,pid,iid,fid,seqn,eid,shareid,mrn,subjid,subject_id,subjectid,participant_id,patient_id,person_id,sample_id,study_id,record_id,dbgap_subject_id

# Files exempt from the file-type, PHI and row-level checks, for example a
# large published reference table: comma-separated paths, folders ending in /,
# or globs, written like .gitignore patterns (a name without / matches in any
# folder; a leading / anchors to the top). An exact path (a full path from the
# top, like inventory/inventory.csv, with no wildcards) skips the file-type,
# PHI and row-level checks; a folder, glob or bare name skips only the PHI and
# row-level checks (data file types, compressed files and caches are still
# refused).
# Neither overrides data/, phi/, .env, the never-commit lists or the size
# limit. Only for files that are not about individuals; changes need the
# PI's approval.
# This repository: pages of the public website (docs/) whose only flags are
# published lab information: the lab's contact email, the clinic phone number
# and its tel: link, DOI suffixes and article numbers, the number in the PI's
# U-M Health profile URL, and sitemap dates. Listed one by one so every other
# page, and any new one, is fully checked. Plus the publications .bib (PubMed
# IDs) and the Qualtrics survey definition (questions only, no responses; one
# line of JSON, so no room for a phi-ok marker).
ALLOW_FILES=docs/contact.html,docs/people.html,docs/publications.html,docs/sitemap.xml,docs/assets/img/README.md,docs/assets/img/email/signature.html,docs/assets/img/email/signature-short.html,tools/Lab_Website.bib,tools/interest-form/survey.qsf

# Files this repository must never commit, even if forced past .gitignore,
# written like .gitignore patterns (a name without / matches in any folder;
# write folders with a trailing /, or only a file of that name is blocked).
# Secrets, salts, checksum manifests and path maps are always refused, in any
# lab repository. Adding entries here only tightens the check.
# Example: BLOCK_FILES=config.R,inventory/integrity/
BLOCK_FILES=
