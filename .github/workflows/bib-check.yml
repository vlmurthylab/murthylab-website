# This repository's own check (not lab core). tools/Lab_Website.bib is
# exported automatically from Zotero, and Better BibTeX's "file" fields are
# paths on the exporting computer, with the user's name, in a public
# repository. The commit hook (hooks/pre-commit.local) refuses them, but it
# only runs where the hook is turned on; this runs on GitHub for every push
# and pull request, including web edits and merges. It runs on every one (no
# path filter), so main's rules can make it a required check: a pull request
# can't then be merged while it fails. It takes a few seconds.
# The .bib is on the PHI check's exact-path list, so that check doesn't
# look inside it.
name: Publications .bib check

on:
  push:
    branches: ['**']          # not tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bib-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No Zotero file fields in the .bib
        run: |
          if [ ! -f tools/Lab_Website.bib ]; then
            echo "tools/Lab_Website.bib is not in this commit; nothing to check."
            exit 0
          fi
          n=$(grep -ci '^[[:space:]]*file[[:space:]]*=' tools/Lab_Website.bib || true)
          if [ "$n" -gt 0 ]; then
            echo "::error file=tools/Lab_Website.bib::$n Zotero \"file\" field(s): paths on the exporting computer, in a public repository. In Zotero, set Better BibTeX to omit file (Settings, Better BibTeX, Export, Fields, and the automatic export's own settings if it has them), export again, copy it over tools/Lab_Website.bib and commit that. See tools/README.md."
            exit 1
          fi
          echo "No Zotero file fields in tools/Lab_Website.bib."
